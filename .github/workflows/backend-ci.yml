name: Backend CI

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: smartmeal-backend

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            .

      - name: Push Docker image to ECR
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
    deploy:
      name: Deploy to ECS Express Mode
      needs: build-and-push
      runs-on: ubuntu-latest

      steps:

        - name: Configure AWS credentials using OIDC
          uses: aws-actions/configure-aws-credentials@v5
          with:
           role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
           aws-region: ${{ env.AWS_REGION }}

        - name: Deploy to ECS Express Mode
          uses: aws-actions/amazon-ecs-deploy-express-service@v1
           with:
            service-name: smartmeal-backend
            image: 398681518047.dkr.ecr.ap-south-1.amazonaws.com/smartmeal-backend:${{ github.sha }}
            execution-role-arn: arn:aws:iam::398681518047:role/SmartMealECSTaskExecutionRole
            infrastructure-role-arn: arn:aws:iam::398681518047:role/ecsInfrastructureRoleForExpressServices
            container-port: 3000
            health-check-path: /api/health
